name: Keep Render tra-da-api alive

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping tra-da-api.onrender.com
        run: |
          STATUS=$(curl -k -s -o /dev/null -w '%{http_code}' --max-time 15 --retry 2 https://tra-da-api.onrender.com/ || echo "ERR_CURL")
          echo "Pong at $(date -u +%Y-%m-%dT%H:%M:%SZ) -- Status: $STATUS"
