services:
  mysql:
    image: mysql:8.4
    container_name: tra-da-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-tea_attendance}
      MYSQL_USER: ${DB_USERNAME:-tra_da_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-tra_da_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - tra-da-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  tra-da-mysql-data:
