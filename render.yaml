services:
  # Free demo/test deployment using Aiven for MySQL's free tier over TLS.
  - type: web
    name: tra-da-api-free
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: REQUIRED
      - key: DB_CREATE_IF_NOT_EXIST
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_SCHEDULER_ENABLED
        value: "true"

  - type: web
    name: tra-da-web-free
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        sync: false
